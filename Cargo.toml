[package]
name = "joke"
version = "0.1.0"
edition = "2024"
authors = ["cool-mist <n.suryap@gmail.com>"]
license = "GPL-3.0-only"
description = "Unofficial CLI to the Official Joke API"

[dependencies]
argh = "0.1.13"
home = "0.5.9"
rand = "0.8.5"
reqwest = { version = "0.12.7", features = ["blocking"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
